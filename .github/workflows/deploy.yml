name: Build and Deploy Resume

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Cache TinyTeX packages
        id: cache-tinytex
        uses: actions/cache@v4
        with:
          path: |
            ~/texmf
            /opt/TinyTeX
          key: tinytex-${{ runner.os }}-${{ hashFiles('.github/workflows/deploy.yml') }}

      - name: Install LaTeX packages
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        run: |
          tlmgr install \
            moderncv \
            ctex \
            fontawesome5 \
            enumitem \
            adjustbox \
            tcolorbox \
            collectbox \
            ucs \
            environ \
            trimspaces \
            titling \
            rsfs \
            texliveonfly \
            xkeyval \
            fancyhdr \
            microtype \
            lm \
            etoolbox \
            colortbl \
            multirow \
            arydshln

      - name: Build resume
        run: npm run build

      - name: Assemble deploy directory
        run: |
          mkdir -p _site
          cp resume.html _site/index.html
          cp resume.pdf _site/resume.pdf
          echo "sha.nemart.in" > _site/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
